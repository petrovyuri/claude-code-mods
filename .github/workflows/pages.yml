# Сайт модов на GitHub Pages: docs/ плюс zip-архив каждого мода из marketplace.json.
name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'plugins/**', '.claude-plugin/marketplace.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить страницу
        run: node --test docs/site.test.mjs
      - name: Собрать сайт и архивы модов
        run: |
          mkdir -p _site/downloads
          cp -r docs/. _site/
          rm -f _site/*.test.mjs
          for mod in $(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.name).join(' ')"); do
            (cd plugins && zip -qr "../_site/downloads/$mod.zip" "$mod" -x "$mod/tests/*")
            zip -qj "_site/downloads/$mod.zip" LICENSE
          done
          ls -la _site/downloads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
